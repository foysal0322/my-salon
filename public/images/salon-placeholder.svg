<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#115e59" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="400" fill="url(#bgGrad)" />

  <!-- Subtle Decorative Geometric Geometry -->
  <circle cx="300" cy="170" r="130" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />
  <circle cx="300" cy="170" r="100" fill="none" stroke="rgba(253, 224, 71, 0.15)" stroke-width="2" stroke-dasharray="6 6" />

  <!-- Central Circle Badge -->
  <circle cx="300" cy="170" r="68" fill="rgba(15, 23, 42, 0.7)" stroke="url(#accentGrad)" stroke-width="3.5" filter="url(#softGlow)" />

  <!-- Stylized Scissors Emblem -->
  <!-- Blade Left -->
  <path d="M272 135 L328 200" stroke="#fde047" stroke-width="5" stroke-linecap="round" />
  <!-- Blade Right -->
  <path d="M328 135 L272 200" stroke="#fde047" stroke-width="5" stroke-linecap="round" />
  <!-- Center Screw -->
  <circle cx="300" cy="167" r="4.5" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
  <!-- Left Handle Ring -->
  <circle cx="265" cy="210" r="13" fill="none" stroke="#fde047" stroke-width="4.5" />
  <!-- Right Handle Ring -->
  <circle cx="335" cy="210" r="13" fill="none" stroke="#fde047" stroke-width="4.5" />

  <!-- Text & Branding -->
  <text x="300" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">AmarSalon</text>
  <text x="300" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#5eead4" text-anchor="middle" letter-spacing="2">SMART SALON PLATFORM</text>
  <rect x="235" y="322" width="130" height="24" rx="12" fill="rgba(255, 255, 255, 0.12)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
  <text x="300" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fde047" text-anchor="middle">ফটোগ্রাফি যুক্ত করুন</text>
</svg>

